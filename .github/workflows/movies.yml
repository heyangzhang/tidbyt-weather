name: Push Coming Soon movies to Tidbyt

on:
  schedule:
    - cron: "7 11 * * *"     # daily, ~6 am Eastern (cron is UTC)
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixlet
        run: |
          curl -sfL https://github.com/tidbyt/pixlet/releases/download/v0.34.0/pixlet_0.34.0_linux_amd64.tar.gz | tar xz pixlet
          sudo mv pixlet /usr/local/bin/

      - name: Render and push
        env:
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./push.sh apps/movies/movies.star movies api_key="$TMDB_API_KEY"
